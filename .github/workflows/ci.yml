name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vitals-api .
      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 5000:5000 vitals-api
          for _ in $(seq 1 30); do curl -fs localhost:5000/health && break; sleep 1; done
          curl -fs localhost:5000/predict -H 'content-type: application/json' \
            -d '{"heart_rate":150,"bp_systolic":180,"bp_diastolic":110,"temperature":39.5,"spo2":85}' \
            | grep -q '"is_anomaly":true'
          for _ in $(seq 1 20); do [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break; sleep 3; done
          docker inspect -f '{{.State.Health.Status}}' api | grep -qx healthy
